; PlatformIO Project Configuration File for SeptiSense ESP32 Firmware
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600

build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DSERIAL_BAUD=921600
    ; Uncomment to enable Wi-Fi HTTP POST fallback transport instead of USB Serial primary
    ; -DTRANSPORT_WIFI

lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
